# ZED X（S/N 49953548）左目相机和机身 IMU 之间的外参、IMU 噪声参数。
# 来源：ZED SDK 5.1.2 读出的出厂标定（2026-10-15，data_recording/scripts/zed_imu_extrinsic.py），
# 和录制时是同一台相机、同一 SDK、同一份出厂标定（自标定关闭）。低速、高速三批数据通用。
#
# 坐标系：都是 ZED SDK 的 IMAGE 坐标系（x 右、y 下、z 前），和 zed_imu.csv 里 IMU 数据的坐标轴相同；平移单位 m。
# camera_imu_transform：SDK 的 sensors_configuration.camera_imu_transform（“IMU to left camera”），4×4，行优先。
#   它把 IMU 坐标系里的向量 / 点变换到左目相机坐标系：v_cam = R · v_imu，p_cam = R · p_imu + t；
#   t 就是 IMU 原点在左目坐标系里的位置（约右 35.6 mm），R 是绕光轴 +0.61° 的转动。
#
# zed_imu.csv 的陀螺仪是在 IMU 自己的坐标系里（SDK 没有转到相机系；加速度计按 SDK 应该相同，没有单独核对）。
# 用 16 条旋转录制核对过陀螺仪
# （真值转角经标定板验证到 0.03% 以内）：
#   - 偏航（绕相机 y）：不转换时陀螺仪 x 轴多出约 1% 的分量，乘上面的 R 以后 ≤ 0.2%，和外参一致；
#   - 俯仰（绕相机 x）：乘 R 以后 y 轴反而多出约 0.85%（不转换时约 −0.2%）。陀螺仪的 x、y 敏感轴本身大约
#     差 0.5° 不正交，这个外参只描述了转动部分；
#   - 陀螺仪刻度比真值大：绕 z 约 +1.3%、绕 y 约 +1.1%、绕 x 约 +0.2%（各条散布约 ±0.4%，50 °/s 和 5 °/s 一致）。
#   做 VIO 时建议在线估计相机–IMU 外参和 IMU 的刻度 / 轴偏（或者把这些当作 IMU 误差），时间偏移见各批的使用说明。
#
# accelerometer / gyroscope：SDK 的 SensorParameters。noise_density 单位为 unit/√Hz，random_walk 为 unit/s/√Hz，
# unit 是加速度计 m/s²、陀螺仪 °/s（zed_imu.csv 里陀螺仪也是 °/s）。只是 SDK 给的标称值，没有实测。
camera_serial: 49953548
zed_sdk: '5.1.2'
firmware: {camera: 2001, sensors: 1000}
coordinate_system: IMAGE
camera_imu_transform:
  - [0.999944150, -0.010571333, 0.000000043, 0.035649005]
  - [0.010571333, 0.999944150, -0.000000149, 0.000147000]
  - [-0.000000041, 0.000000149, 1.000000000, 0.000000000]
  - [0.000000000, 0.000000000, 0.000000000, 1.000000000]
accelerometer:
  available: True
  unit: 'SENSORS_UNIT.M_SEC_2'
  sampling_rate_hz: 200.0
  range: [-78.4800033569336, 78.4800033569336]
  resolution: 0.002395019633695483
  noise_density: 0.0013500000350177288
  random_walk: 0.00419999985024333
gyroscope:
  available: True
  unit: 'SENSORS_UNIT.DEG_SEC'
  sampling_rate_hz: 200.0
  range: [-1000.0, 1000.0]
  resolution: 0.030517578125
  noise_density: 0.004720999859273434
  random_walk: 0.003800000064074993
